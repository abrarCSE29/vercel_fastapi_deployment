<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to FastAPI</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            z-index: 100;
            transition: opacity 1s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="loading">Loading scene...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        setTimeout(() => document.getElementById('loading').classList.add('hidden'), 500);

        // ---- Scene ----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 20, 60);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(3, 2.0, 6);
        camera.lookAt(0, 1.5, -1);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1.2, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.minPolarAngle = 0.8;
        controls.maxPolarAngle = 1.8;
        controls.minDistance = 4;
        controls.maxDistance = 15;
        controls.update();

        // ---- Lights ----
        const sunLight = new THREE.DirectionalLight(0xffeedd, 2.0);
        sunLight.position.set(20, 30, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 60;
        sunLight.shadow.camera.left = -15;
        sunLight.shadow.camera.right = 15;
        sunLight.shadow.camera.top = 15;
        sunLight.shadow.camera.bottom = -15;
        scene.add(sunLight);

        scene.add(new THREE.AmbientLight(0x8888ff, 0.4));

        const fill = new THREE.DirectionalLight(0x8888ff, 0.3);
        fill.position.set(-10, 5, -10);
        scene.add(fill);

        // ---- Ground ----
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(80, 80),
            new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.9 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ---- Mountains ----
        function createMountain(x, z, height, radius) {
            const m = new THREE.Mesh(
                new THREE.ConeGeometry(radius, height, 8 + Math.floor(Math.random() * 4)),
                new THREE.MeshStandardMaterial({
                    color: new THREE.Color().setHSL(0.3, 0.4, 0.2 + Math.random() * 0.15),
                    roughness: 0.8, flatShading: true
                })
            );
            m.position.set(x, height / 2, z);
            m.castShadow = true;
            m.receiveShadow = true;
            scene.add(m);
        }
        [[-18,-15,6,5],[-6,-18,5,4],[8,-16,7,6],[20,-12,4,5],[-12,-22,8,6],[15,-20,5,4],[-22,-8,4,4],[0,-20,6,5],[25,-18,5,5]]
            .forEach(([x,z,h,r]) => createMountain(x,z,h,r));

        // ---- Trees ----
        function createTree(x, z) {
            const g = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 1, 6), new THREE.MeshStandardMaterial({color:0x8B4513,roughness:0.9}));
            trunk.position.y = 0.5; trunk.castShadow = true; g.add(trunk);
            const fol = new THREE.Mesh(new THREE.SphereGeometry(0.4+Math.random()*0.3,6,6), new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.3,0.7,0.3+Math.random()*0.2),roughness:0.8}));
            fol.position.y = 1.2+Math.random()*0.3; fol.castShadow = true; g.add(fol);
            g.position.set(x,0,z); scene.add(g);
        }
        for (let i = 0; i < 30; i++) {
            let x, z;
            do { x = (Math.random()-0.5)*30; z = -5-Math.random()*15; } while (Math.abs(x)<4 && Math.abs(z+5)<6);
            createTree(x, z);
        }

        // ---- Build Person ----
        const personGroup = new THREE.Group();
        const skinColor = 0xf5cba7;
        const shirtColor = 0xe74c3c;
        const pantsColor = 0x2c3e50;
        const shoeColor = 0x1a1a1a;

        // Torso
        const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 0.8, 10), new THREE.MeshStandardMaterial({color:shirtColor,roughness:0.6}));
        torso.position.y = 0.65; torso.castShadow = true;
        personGroup.add(torso);

        // Neck
        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.08, 6), new THREE.MeshStandardMaterial({color:skinColor,roughness:0.8}));
        neck.position.y = 1.05;
        personGroup.add(neck);

        // Head
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 20, 20), new THREE.MeshStandardMaterial({color:skinColor,roughness:0.6}));
        head.position.y = 1.3; head.castShadow = true;
        personGroup.add(head);

        // Happy face
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), eyeMat);
        eye.position.set(-0.1, 1.35, 0.26); personGroup.add(eye);
        const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), eyeMat);
        eye2.position.set(0.1, 1.35, 0.26); personGroup.add(eye2);

        // Eye gleams
        const gleamMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const g1 = new THREE.Mesh(new THREE.SphereGeometry(0.018, 6, 6), gleamMat);
        g1.position.set(-0.08, 1.36, 0.31); personGroup.add(g1);
        const g2 = new THREE.Mesh(new THREE.SphereGeometry(0.018, 6, 6), gleamMat);
        g2.position.set(0.12, 1.36, 0.31); personGroup.add(g2);

        // Eyebrows
        const browMat = new THREE.MeshStandardMaterial({ color: 0x4a3728 });
        const brow = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.012, 4, 8, Math.PI), browMat);
        brow.position.set(-0.1, 1.42, 0.25); brow.rotation.z = 0.15; brow.rotation.x = 0.1; personGroup.add(brow);
        const brow2 = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.012, 4, 8, Math.PI), browMat);
        brow2.position.set(0.1, 1.42, 0.25); brow2.rotation.z = -0.15; brow2.rotation.x = 0.1; personGroup.add(brow2);

        // Cheeks
        const cheekMat = new THREE.MeshStandardMaterial({ color: 0xffaaaa, transparent: true, opacity: 0.4 });
        const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.055, 6, 6), cheekMat);
        cheek.position.set(-0.2, 1.26, 0.22); personGroup.add(cheek);
        const cheek2 = new THREE.Mesh(new THREE.SphereGeometry(0.055, 6, 6), cheekMat);
        cheek2.position.set(0.2, 1.26, 0.22); personGroup.add(cheek2);

        // Smile
        const smile = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.016, 6, 12, Math.PI), new THREE.MeshStandardMaterial({color:0xc0392b}));
        smile.position.set(0, 1.22, 0.3); smile.rotation.x = 0.15; personGroup.add(smile);

        // Teeth
        const teeth = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.02, 0.02), new THREE.MeshStandardMaterial({color:0xffffff}));
        teeth.position.set(0, 1.205, 0.33); personGroup.add(teeth);

        // Nose
        const nose = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 6), new THREE.MeshStandardMaterial({color:0xe8b88a}));
        nose.position.set(0, 1.28, 0.3); personGroup.add(nose);

        // Hair
        const hair = new THREE.Mesh(new THREE.SphereGeometry(0.31, 14, 14, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({color:0x4a3728,roughness:0.9}));
        hair.scale.y = 0.3; hair.position.y = 1.4; personGroup.add(hair);

        // Arms
        const armMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.7 });
        const armGeo = new THREE.CylinderGeometry(0.08, 0.1, 0.6, 6);
        const leftArm = new THREE.Mesh(armGeo, armMat);
        leftArm.position.set(-0.55, 0.7, 0); leftArm.rotation.z = 0.15; leftArm.castShadow = true; personGroup.add(leftArm);
        const rightArm = new THREE.Mesh(armGeo, armMat);
        rightArm.position.set(0.55, 0.7, 0); rightArm.rotation.z = -0.15; rightArm.castShadow = true; personGroup.add(rightArm);

        // Legs
        const legMat = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.7 });
        const legGeo = new THREE.CylinderGeometry(0.12, 0.1, 0.5, 6);
        const leftLeg = new THREE.Mesh(legGeo, legMat);
        leftLeg.position.set(-0.16, 0.2, 0); personGroup.add(leftLeg);
        const rightLeg = new THREE.Mesh(legGeo, legMat);
        rightLeg.position.set(0.16, 0.2, 0); personGroup.add(rightLeg);

        // Shoes
        const shoeMat = new THREE.MeshStandardMaterial({ color: shoeColor, roughness: 0.9 });
        const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.06, 0.3), shoeMat);
        shoe.position.set(-0.16, 0.0, 0.03); personGroup.add(shoe);
        const shoe2 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.06, 0.3), shoeMat);
        shoe2.position.set(0.16, 0.0, 0.03); personGroup.add(shoe2);

        // ---- Welcome Board with canvas text ----
        const boardGroup = new THREE.Group();

        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 140;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#f5deb3';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#6d4c2a';
        ctx.lineWidth = 6;
        ctx.strokeRect(6, 6, canvas.width-12, canvas.height-12);
        ctx.strokeStyle = '#8B6914';
        ctx.lineWidth = 2;
        ctx.strokeRect(14, 14, canvas.width-28, canvas.height-28);

        // Decorative corners
        ctx.fillStyle = '#6d4c2a';
        [[14,14],[canvas.width-36,14],[14,canvas.height-36],[canvas.width-36,canvas.height-36]].forEach(([x,y]) => ctx.fillRect(x,y,22,22));
        ctx.fillStyle = '#f5deb3';
        [[18,18],[canvas.width-32,18],[18,canvas.height-32],[canvas.width-32,canvas.height-32]].forEach(([x,y]) => ctx.fillRect(x,y,14,14));

        ctx.fillStyle = '#2c3e50';
        ctx.font = 'bold 22px Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✨ Welcome to ✨', canvas.width/2, 36);

        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 40px Arial, sans-serif';
        ctx.fillText('FastAPI', canvas.width/2, 84);

        ctx.fillStyle = '#7f8c8d';
        ctx.font = '16px Arial, sans-serif';
        ctx.fillText('Deployed on Vercel', canvas.width/2, 118);

        const boardTexture = new THREE.CanvasTexture(canvas);

        // Board stick
        const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8, 6), new THREE.MeshStandardMaterial({color:0x8B4513,roughness:0.9}));
        stick.position.y = 0.4;
        boardGroup.add(stick);

        // Board plaque
        const boardMat = new THREE.MeshStandardMaterial({ map: boardTexture, roughness: 0.6 });
        const boardMesh = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.38, 0.03), boardMat);
        boardMesh.position.y = 0.85;
        boardGroup.add(boardMesh);

        // Border frame
        const borderMat = new THREE.MeshStandardMaterial({ color: 0x6d4c2a });
        [[0,1.04,0,0.74,0.02,0.04],[0,0.66,0,0.74,0.02,0.04],[-0.36,0.85,0,0.02,0.40,0.04],[0.36,0.85,0,0.02,0.40,0.04]]
            .forEach(([px,py,pz,w,h,d]) => {
                const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), borderMat);
                b.position.set(px,py,pz);
                boardGroup.add(b);
            });

        // Position board in right hand
        boardGroup.position.set(0.6, 0.55, 0.25);
        boardGroup.rotation.z = -0.2;
        boardGroup.rotation.x = -0.1;
        boardGroup.rotation.y = 0.3;
        personGroup.add(boardGroup);

        // Position person far away
        personGroup.position.set(0, 0, -18);
        scene.add(personGroup);

        // ---- Grass ----
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x3d8b37, roughness: 0.9 });
        for (let i = 0; i < 50; i++) {
            const blade = new THREE.Mesh(new THREE.ConeGeometry(0.015, 0.08+Math.random()*0.12, 3), grassMat);
            const angle = Math.random()*Math.PI*2;
            const dist = 0.5+Math.random()*4;
            blade.position.set(Math.cos(angle)*dist, 0.03, -2+Math.sin(angle)*dist);
            blade.rotation.x = (Math.random()-0.5)*0.3;
            blade.rotation.z = (Math.random()-0.5)*0.3;
            scene.add(blade);
        }

        // ---- Welcome overlay ----
        const overlay = document.createElement('div');
        overlay.style.cssText = `
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; font-size: 3.5rem; font-weight: bold; text-align: center;
            text-shadow: 3px 3px 15px rgba(0,0,0,0.8), 0 0 40px rgba(0,0,0,0.5);
            z-index: 10; opacity: 0; transition: opacity 1.5s ease;
            pointer-events: none;
            font-family: 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; line-height: 1.3;
        `;
        overlay.innerHTML = '🚀 Welcome to FastAPI<br><span style="font-size:1.3rem;opacity:0.8;">Deployed on Vercel</span>';
        document.body.appendChild(overlay);

        // ---- Leaves ----
        const leaves = [];
        for (let i = 0; i < 20; i++) {
            const leaf = new THREE.Mesh(
                new THREE.PlaneGeometry(0.04, 0.025),
                new THREE.MeshStandardMaterial({color:0x8BC34A,transparent:true,opacity:0.5,side:THREE.DoubleSide})
            );
            leaf.position.set((Math.random()-0.5)*20, 1+Math.random()*4, -Math.random()*15);
            leaf.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
            scene.add(leaf);
            leaves.push({mesh:leaf, speed:0.2+Math.random()*0.3, rotSpeed:Math.random()*0.02});
        }

        // ---- Sun glare ----
        const sunGlare = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshBasicMaterial({color:0xffffcc,transparent:true,opacity:0.12}));
        sunGlare.position.set(20, 30, 10);
        scene.add(sunGlare);

        // ---- Animation ----
        const startZ = -18;
        const endZ = -1.5;
        const runDuration = 4000;
        let runStartTime = Date.now();
        let phase = 0;

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = Date.now() - runStartTime;
            const time = Date.now() * 0.002;

            // ---- Phase 1: Running ----
            if (phase === 0) {
                const progress = Math.min(elapsed / runDuration, 1);
                const eased = progress < 0.5 ? 2*progress*progress : 1-Math.pow(-2*progress+2,2)/2;
                personGroup.position.z = startZ + (endZ - startZ) * eased;

                const runCycle = time * 5;
                const step = Math.sin(runCycle) * 0.5;
                leftLeg.rotation.x = step;
                rightLeg.rotation.x = -step;
                const armSwing = Math.sin(runCycle + Math.PI) * 0.5;
                leftArm.rotation.x = 0.2 + armSwing;
                rightArm.rotation.x = -0.2 - armSwing;
                personGroup.position.y = Math.abs(Math.sin(runCycle)) * 0.06;
                boardGroup.position.y = 0.55 + Math.abs(Math.sin(runCycle * 1.2)) * 0.03;

                if (progress >= 1) {
                    phase = 1;
                    personGroup.position.z = endZ;
                    setTimeout(() => { overlay.style.opacity = '1'; }, 200);
                }
            }

            // ---- Phase 2: Stopped ----
            if (phase === 1) {
                const breathe = Math.sin(time * 2) * 0.008;
                torso.position.y = 0.65 + breathe;
                head.position.y = 1.3 + breathe;

                rightArm.rotation.x = -0.4 + Math.sin(time * 1.5) * 0.08;
                rightArm.rotation.z = -0.35;
                leftArm.rotation.x = 0.15 + Math.sin(time * 1.5) * 0.05;
                boardGroup.position.y = 0.55 + Math.sin(time * 1.5) * 0.02;
                boardGroup.rotation.z = -0.3 + Math.sin(time) * 0.02;

                leftLeg.rotation.x *= 0.9;
                rightLeg.rotation.x *= 0.9;
                personGroup.position.y = Math.sin(time * 2) * 0.01;
            }

            // ---- Leaves ----
            leaves.forEach(l => {
                l.mesh.position.y -= l.speed * 0.01;
                l.mesh.position.x += Math.sin(time + l.mesh.id) * 0.003;
                l.mesh.rotation.x += l.rotSpeed;
                l.mesh.rotation.y += l.rotSpeed * 0.7;
                if (l.mesh.position.y < -1) {
                    l.mesh.position.y = 2 + Math.random() * 3;
                    l.mesh.position.x = (Math.random() - 0.5) * 20;
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
